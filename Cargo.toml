[package]
name = "mech-keyboard"
version = "0.1.0"
edition = "2021"
description = "Lightweight tray app that plays a mechanical keyboard click on every keypress"
license = "MIT"

[[bin]]
name = "mech-keyboard"
path = "src/main.rs"

[dependencies]
rdev = "0.5"
rodio = "0.17"
tray-icon = "0.19"
winit = "0.29"
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
image = { version = "0.24", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
